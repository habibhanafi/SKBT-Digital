<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Asisten SKBT Digital
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #f1f5f9;

  color:
    #1e293b;

}


/* =====================================================
   CONTAINER
   ===================================================== */

.chat-container {

  width:
    100%;

  max-width:
    700px;

  height:
    100vh;

  max-height:
    850px;

  margin:
    auto;

  background:
    white;

  display:
    flex;

  flex-direction:
    column;

}


/* =====================================================
   HEADER
   ===================================================== */

.chat-header {

  background:
    #0f766e;

  color:
    white;

  padding:
    18px;

}

.chat-header h2 {

  margin:
    0;

  font-size:
    20px;

}

.chat-header p {

  margin:
    5px 0 0;

  font-size:
    13px;

  opacity:
    .9;

}


/* =====================================================
   CHAT
   ===================================================== */

.chat-box {

  flex:
    1;

  overflow-y:
    auto;

  padding:
    18px;

}


/* =====================================================
   MESSAGE
   ===================================================== */

.message {

  display:
    flex;

  margin-bottom:
    14px;

}

.message.user {

  justify-content:
    flex-end;

}

.message.bot {

  justify-content:
    flex-start;

}

.bubble {

  max-width:
    82%;

  padding:
    11px 14px;

  border-radius:
    14px;

  font-size:
    14px;

  line-height:
    1.5;

  white-space:
    pre-wrap;

}

.user .bubble {

  background:
    #0f766e;

  color:
    white;

  border-bottom-right-radius:
    4px;

}

.bot .bubble {

  background:
    #f1f5f9;

  color:
    #1e293b;

  border-bottom-left-radius:
    4px;

}


/* =====================================================
   QUICK QUESTIONS
   ===================================================== */

.quick {

  padding:
    10px 15px;

  border-top:
    1px solid #e2e8f0;

  background:
    white;

}

.quick-title {

  font-size:
    12px;

  color:
    #64748b;

  margin-bottom:
    8px;

}

.quick-buttons {

  display:
    flex;

  gap:
    7px;

  overflow-x:
    auto;

}

.quick button {

  border:
    1px solid #cbd5e1;

  background:
    white;

  border-radius:
    20px;

  padding:
    8px 12px;

  font-size:
    12px;

  white-space:
    nowrap;

  cursor:
    pointer;

}

.quick button:hover {

  background:
    #f1f5f9;

}


/* =====================================================
   INPUT
   ===================================================== */

.input-area {

  display:
    flex;

  padding:
    12px;

  border-top:
    1px solid #e2e8f0;

  gap:
    8px;

}

.input-area input {

  flex:
    1;

  border:
    1px solid #cbd5e1;

  border-radius:
    22px;

  padding:
    11px 15px;

  outline:
    none;

  font-size:
    14px;

}

.input-area input:focus {

  border-color:
    #0f766e;

}

.input-area button {

  width:
    44px;

  height:
    44px;

  border:
    none;

  border-radius:
    50%;

  background:
    #0f766e;

  color:
    white;

  cursor:
    pointer;

  font-size:
    18px;

}

.input-area button:disabled {

  opacity:
    .5;

  cursor:
    not-allowed;

}


/* =====================================================
   TYPING
   ===================================================== */

.typing {

  font-size:
    13px;

  color:
    #64748b;

  padding:
    5px 0;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (
  max-width: 600px
) {

  .chat-container {

    max-height:
      none;

  }

  .bubble {

    max-width:
      90%;

  }

}

</style>

</head>


<body>


<div class="chat-container">


  <!-- HEADER -->

  <div class="chat-header">

    <h2>
      🤖 Asisten SKBT Digital
    </h2>

    <p>
      Informasi layanan SKBT Inspektorat
      Daerah Kabupaten Aceh Timur
    </p>

  </div>


  <!-- CHAT -->

  <div
    id="chatBox"
    class="chat-box"
  ></div>


  <!-- QUICK QUESTIONS -->

  <div class="quick">

    <div class="quick-title">
      Pertanyaan yang sering ditanyakan
    </div>

    <div class="quick-buttons">

      <button
        onclick="quickQuestion('Apa itu SKBT?')"
      >
        Apa itu SKBT?
      </button>

      <button
        onclick="quickQuestion('Apa saja persyaratan SKBT?')"
      >
        Persyaratan
      </button>

      <button
        onclick="quickQuestion('Bagaimana cara mengajukan SKBT?')"
      >
        Cara Pengajuan
      </button>

      <button
        onclick="quickQuestion('Dokumen apa saja yang harus disiapkan?')"
      >
        Dokumen
      </button>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Tulis pertanyaan Anda..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>


</div>


<script>


/* =====================================================
   KONFIGURASI
   ===================================================== */

const WORKER_URL =
  "https://quiet-bush-fe39.muhammadhabib348.workers.dev/";


/* =====================================================
   ELEMENT
   ===================================================== */

const chatBox =
  document.getElementById(
    "chatBox"
  );

const input =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );


/* =====================================================
   HISTORY
   ===================================================== */

let history = [];


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   TAMBAH PESAN
   ===================================================== */

function addMessage(
  text,
  sender
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    sender;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  bubble.innerHTML =
    escapeHtml(
      text
    );


  message.appendChild(
    bubble
  );


  chatBox.appendChild(
    message
  );


  chatBox.scrollTop =
    chatBox.scrollHeight;

}


/* =====================================================
   TYPING
   ===================================================== */

function showTyping() {

  const typing =
    document.createElement(
      "div"
    );

  typing.id =
    "typing";

  typing.className =
    "typing";

  typing.textContent =
    "Asisten sedang mengetik...";


  chatBox.appendChild(
    typing
  );


  chatBox.scrollTop =
    chatBox.scrollHeight;

}


function hideTyping() {

  const typing =
    document.getElementById(
      "typing"
    );

  if (typing) {

    typing.remove();

  }

}


/* =====================================================
   KIRIM PESAN
   ===================================================== */

async function sendMessage(
  customMessage = ""
) {

  const message =
    (
      customMessage ||
      input.value
    ).trim();


  if (!message) {
    return;
  }


  addMessage(
    message,
    "user"
  );


  input.value =
    "";


  input.disabled =
    true;

  sendButton.disabled =
    true;


  showTyping();


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                message,

              history:
                history

            })

        }
      );


    const data =
      await response.json();


    hideTyping();


    if (
      !data.success
    ) {

      addMessage(

        data.error ||
        "Maaf, terjadi kesalahan.",

        "bot"

      );

      return;

    }


    const answer =
      data.answer;


    addMessage(
      answer,
      "bot"
    );


    /*
     * Simpan percakapan
     */

    history.push({

      role:
        "user",

      content:
        message

    });


    history.push({

      role:
        "assistant",

      content:
        answer

    });


    /*
     * Batasi history
     */

    if (
      history.length > 12
    ) {

      history =
        history.slice(-12);

    }


  }

  catch (error) {

    console.error(
      error
    );


    hideTyping();


    addMessage(

      "Maaf, chatbot sedang mengalami kendala. " +
      "Silakan coba beberapa saat lagi.",

      "bot"

    );

  }


  finally {

    input.disabled =
      false;

    sendButton.disabled =
      false;

    input.focus();

  }

}


/* =====================================================
   QUICK QUESTION
   ===================================================== */

function quickQuestion(
  question
) {

  sendMessage(
    question
  );

}


/* =====================================================
   ENTER
   ===================================================== */

input.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }

);


/* =====================================================
   PESAN AWAL
   ===================================================== */

addMessage(

  "Halo 👋\n\n" +

  "Saya Asisten SKBT Digital. " +

  "Saya dapat membantu menjawab pertanyaan " +
  "mengenai layanan Surat Keterangan Bebas " +
  "Temuan (SKBT) Inspektorat Daerah " +
  "Kabupaten Aceh Timur.\n\n" +

  "Silakan tanyakan apa yang ingin Anda ketahui.",

  "bot"

);

</script>


</body>

</html>
