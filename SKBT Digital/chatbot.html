<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asisten SKBT Digital</title>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #eef5fb;
}

.chat-wrapper {
    width: min(900px, 100%);
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    overflow: hidden;
}

/* HEADER */
.chat-header {
    flex: 0 0 auto;
    padding: 22px 26px;
    background: linear-gradient(
        135deg,
        #1565c0,
        #0d47a1
    );
    color: white;
}

/* AREA CHAT */
.chat-messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    scroll-behavior: smooth;
}

/* AREA FAQ */
.quick-actions {
    flex: 0 0 auto;
    padding: 10px 14px 6px;
    background: white;
}

/* INPUT */
.chat-input-area {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
    background: white;
}
</style>

</head>


<body>


<div class="chat-container">


  <!-- HEADER -->

  <div class="chat-header">

    <div class="logo">
      🤖
    </div>

    <div>

      <div class="header-title">
        Asisten SKBT Digital
      </div>

      <div class="header-subtitle">
        Inspektorat Daerah Kabupaten Aceh Timur
      </div>

    </div>

  </div>


  <!-- PESAN -->

  <div
    id="chatMessages"
    class="chat-messages"
  >

    <div class="message bot">

      <div class="bubble">

        Halo 👋

        Saya adalah
        <b>Asisten SKBT Digital</b>.

        Saya dapat membantu memberikan
        informasi mengenai layanan
        Surat Keterangan Bebas Temuan
        (SKBT).

        Silakan tanyakan sesuatu
        mengenai SKBT.

      </div>

    </div>

  </div>


  <!-- QUICK QUESTIONS -->

  <div class="quick-questions">

    <button
      type="button"
      class="quick-btn"
      onclick="quickQuestion('Apa itu SKBT?')"
    >
      Apa itu SKBT?
    </button>

    <button
      type="button"
      class="quick-btn"
      onclick="quickQuestion('Apa saja persyaratan SKBT?')"
    >
      Persyaratan
    </button>

    <button
      type="button"
      class="quick-btn"
      onclick="quickQuestion('Bagaimana alur pengajuan SKBT?')"
    >
      Alur Pengajuan
    </button>

  </div>


  <!-- TYPING -->

  <div
    id="typing"
    class="typing"
  >

    Asisten sedang mengetik...

  </div>


  <!-- INPUT -->

  <form
    id="chatForm"
    class="chat-input-area"
  >

    <input
      id="chatInput"
      class="chat-input"
      type="text"
      placeholder="Tulis pertanyaan..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      class="send-btn"
      type="submit"
      title="Kirim"
    >
      ➤
    </button>

  </form>


</div>


<script>

/* =====================================================
   KONFIGURASI WORKER
   ===================================================== */

const WORKER_URL =
  "https://quiet-bush-fe39.muhammadhabib348.workers.dev/";


/* =====================================================
   ELEMENT
   ===================================================== */

const chatForm =
  document.getElementById(
    "chatForm"
  );

const chatInput =
  document.getElementById(
    "chatInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const chatMessages =
  document.getElementById(
    "chatMessages"
  );

const typing =
  document.getElementById(
    "typing"
  );


/* =====================================================
   HISTORY
   ===================================================== */

let chatHistory = [];


/* =====================================================
   TAMBAH PESAN
   ===================================================== */

function addMessage(
  text,
  sender
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    sender;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  message.appendChild(
    bubble
  );


  chatMessages.appendChild(
    message
  );


  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =====================================================
   QUICK QUESTION
   ===================================================== */

function quickQuestion(
  question
) {

  chatInput.value =
    question;

  chatInput.focus();

  sendMessage();

}


/* =====================================================
   SUBMIT
   ===================================================== */

chatForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    sendMessage();

  }
);


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

  const message =
    chatInput.value.trim();


  if (!message) {

    chatInput.focus();

    return;

  }


  /* tampilkan pesan user */

  addMessage(
    message,
    "user"
  );


  /* kosongkan input */

  chatInput.value = "";


  /* disable */

  sendButton.disabled =
    true;

  chatInput.disabled =
    true;


  typing.style.display =
    "block";


  try {

    console.log(
      "Mengirim pertanyaan:",
      message
    );


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                message,

              history:
                chatHistory

            })

        }
      );


    console.log(
      "HTTP STATUS:",
      response.status
    );


    const data =
      await response.json();


    console.log(
      "RESPONSE WORKER:",
      data
    );


    /* =========================================
       ERROR DARI WORKER
       ========================================= */

    if (
      !response.ok ||
      !data.success
    ) {

      const detail =
        data.detail ||
        data.error ||
        "Gagal mendapatkan jawaban.";

      throw new Error(
        detail
      );

    }


    /* =========================================
       JAWABAN
       ========================================= */

    const answer =
      data.answer;


    if (!answer) {

      throw new Error(
        "Jawaban dari AI kosong."
      );

    }


    addMessage(
      answer,
      "bot"
    );


    /* =========================================
       SIMPAN HISTORY
       ========================================= */

    chatHistory.push({

      role:
        "user",

      content:
        message

    });


    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    /* batasi history */

    if (
      chatHistory.length > 10
    ) {

      chatHistory =
        chatHistory.slice(-10);

    }


  }

  catch (error) {

    console.error(
      "ERROR CHATBOT:",
      error
    );


    addMessage(

      "Maaf, terjadi kesalahan saat " +
      "menghubungi Asisten SKBT Digital.\n\n" +
      error.message,

      "bot"

    );

  }


  finally {

    typing.style.display =
      "none";


    sendButton.disabled =
      false;

    chatInput.disabled =
      false;


    chatInput.focus();

  }

}


/* =====================================================
   ENTER
   ===================================================== */

chatInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>


</body>
</html>
