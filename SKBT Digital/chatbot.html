<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Asisten SKBT Digital</title>

<style>

/* =========================================================
   FULLSCREEN CHATBOT
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #eef5fb;
}


/* =========================================================
   CONTAINER UTAMA
   ========================================================= */

.chat-container {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background: #ffffff;

    overflow: hidden;

    z-index: 99999;
}


/* =========================================================
   HEADER
   ========================================================= */

.chat-header {

    flex: 0 0 auto;

    display: flex;
    align-items: center;

    gap: 14px;

    padding:
        15px 22px;

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #1565c0,
            #0d47a1
        );

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.12);

    z-index: 2;
}


.logo {

    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.15);

    font-size: 25px;
}


.header-title {

    font-size: 21px;

    font-weight: bold;

    line-height: 1.2;
}


.header-subtitle {

    margin-top: 3px;

    font-size: 13px;

    line-height: 1.3;

    opacity: 0.95;
}


/* =========================================================
   AREA PESAN
   ========================================================= */

.chat-messages {

    flex: 1 1 auto;

    min-height: 0;

    width: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 20px;

    background:
        #f7faff;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;
}


/* =========================================================
   PESAN
   ========================================================= */

.message {

    width: 100%;

    display: flex;

    margin-bottom: 14px;
}


.message.bot {

    justify-content: flex-start;
}


.message.user {

    justify-content: flex-end;
}


/* =========================================================
   BUBBLE
   ========================================================= */

.bubble {

    max-width: min(760px, 78%);

    padding: 12px 15px;

    border-radius: 14px;

    font-size: 14px;

    line-height: 1.55;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

    word-break: break-word;
}


.message.bot .bubble {

    background:
        #e6f0fb;

    color:
        #123f70;

    border-top-left-radius: 5px;
}


.message.user .bubble {

    background:
        #1565c0;

    color:
        #ffffff;

    border-top-right-radius: 5px;
}


/* =========================================================
   LINK DARI AI
   ========================================================= */

.chat-link {

    display: inline-block;

    margin: 3px 0;

    color: #075bb5;

    font-weight: bold;

    text-decoration: underline;

    cursor: pointer;
}


.chat-link:hover {

    color: #00a9c7;
}


/* =========================================================
   QUICK QUESTIONS
   ========================================================= */

.quick-questions {

    flex: 0 0 auto;

    display: flex;

    gap: 8px;

    width: 100%;

    padding:
        9px 14px 7px;

    background:
        #ffffff;

    border-top:
        1px solid #e5edf5;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: none;
}


.quick-questions::-webkit-scrollbar {

    display: none;
}


.quick-btn {

    flex: 0 0 auto;

    padding:
        8px 13px;

    border:
        1px solid #9fc1e4;

    border-radius:
        20px;

    background:
        #ffffff;

    color:
        #1565c0;

    font-size:
        12px;

    cursor:
        pointer;

    transition:
        0.2s ease;
}


.quick-btn:hover {

    background:
        #00a9c7;

    color:
        #ffffff;

    border-color:
        #00a9c7;
}


/* =========================================================
   TYPING
   ========================================================= */

.typing {

    display: none;

    flex: 0 0 auto;

    padding:
        2px 14px 6px;

    background:
        #ffffff;

    color:
        #7a8b9d;

    font-size:
        11px;

    font-style:
        italic;
}


/* =========================================================
   INPUT
   ========================================================= */

.chat-input-area {

    flex: 0 0 auto;

    display: flex;

    gap: 8px;

    width: 100%;

    padding:
        9px 14px
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    background:
        #ffffff;

    border-top:
        1px solid #e5edf5;
}


/* =========================================================
   INPUT TEXT
   ========================================================= */

.chat-input {

    flex: 1;

    min-width: 0;

    height: 44px;

    padding:
        0 13px;

    border:
        1px solid #b5cbe2;

    border-radius:
        10px;

    outline:
        none;

    background:
        #ffffff;

    color:
        #17324d;

    font-size:
        14px;
}


.chat-input:focus {

    border-color:
        #1565c0;

    box-shadow:
        0 0 0 3px
        rgba(21,101,192,0.10);
}


.chat-input::placeholder {

    color:
        #8a9bad;
}


/* =========================================================
   TOMBOL KIRIM
   ========================================================= */

.send-btn {

    width: 48px;
    height: 44px;

    flex: 0 0 48px;

    border: none;

    border-radius: 10px;

    background:
        #1565c0;

    color:
        #ffffff;

    font-size:
        20px;

    cursor:
        pointer;

    transition:
        0.2s ease;
}


.send-btn:hover {

    background:
        #00a9c7;
}


.send-btn:disabled {

    opacity:
        0.55;

    cursor:
        not-allowed;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 768px) {

    .chat-header {

        padding:
            12px 15px;
    }


    .logo {

        width: 40px;
        height: 40px;

        flex-basis: 40px;

        font-size: 22px;
    }


    .header-title {

        font-size:
            18px;
    }


    .header-subtitle {

        font-size:
            11px;
    }


    .chat-messages {

        padding:
            13px;
    }


    .bubble {

        max-width:
            88%;

        font-size:
            13px;
    }

}


/* =========================================================
   HP
   ========================================================= */

@media (max-width: 600px) {

    html,
    body {

        width: 100%;
        height: 100%;

        overflow: hidden;
    }


    .chat-container {

        position: fixed;

        inset: 0;

        width: 100%;

        height: 100dvh;

        min-height: 100dvh;

        max-height: none;

        border-radius:
            0;

        box-shadow:
            none;
    }


    .chat-header {

        padding:
            10px 12px;

        gap:
            9px;
    }


    .logo {

        width:
            38px;

        height:
            38px;

        flex-basis:
            38px;

        border-radius:
            10px;

        font-size:
            21px;
    }


    .header-title {

        font-size:
            17px;
    }


    .header-subtitle {

        margin-top:
            2px;

        font-size:
            10px;
    }


    .chat-messages {

        padding:
            10px;
    }


    .message {

        margin-bottom:
            10px;
    }


    .bubble {

        max-width:
            92%;

        padding:
            9px 11px;

        border-radius:
            12px;

        font-size:
            13px;

        line-height:
            1.5;
    }


    .quick-questions {

        gap:
            6px;

        padding:
            7px 9px 5px;
    }


    .quick-btn {

        padding:
            7px 10px;

        font-size:
            11px;
    }


    .chat-input-area {

        gap:
            6px;

        padding:
            7px 9px
            calc(
                9px +
                env(safe-area-inset-bottom)
            );
    }


    .chat-input {

        height:
            42px;

        padding:
            0 11px;

        font-size:
            13px;
    }


    .send-btn {

        width:
            44px;

        height:
            42px;

        flex-basis:
            44px;

        font-size:
            18px;
    }

}
    
</style>

</head>


<body>


<!-- =======================================================
     CHATBOT
     ======================================================= -->

<div class="chat-container">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <div class="chat-header">

        <div class="logo">
            🤖
        </div>

        <div>

            <div class="header-title">
                Asisten SKBT Digital
            </div>

            <div class="header-subtitle">
                Inspektorat Daerah Kabupaten Aceh Timur
            </div>

        </div>

    </div>


    <!-- ===================================================
         AREA CHAT
         =================================================== -->

    <div
        id="chatMessages"
        class="chat-messages"
    >

        <div class="message bot">

            <div class="bubble">Halo 👋

Saya adalah <b>Asisten SKBT Digital</b>.

Saya dapat membantu memberikan informasi mengenai layanan Surat Keterangan Bebas Temuan (SKBT).

Silakan tanyakan sesuatu mengenai SKBT.</div>

        </div>

    </div>


    <!-- ===================================================
         QUICK QUESTIONS
         =================================================== -->

    <div class="quick-questions">

        <button
            type="button"
            class="quick-btn"
            onclick="quickQuestion('Apa itu SKBT?')"
        >
            📄 Apa itu SKBT?
        </button>


        <button
            type="button"
            class="quick-btn"
            onclick="quickQuestion('Apa saja persyaratan SKBT?')"
        >
            📋 Persyaratan
        </button>


        <button
            type="button"
            class="quick-btn"
            onclick="quickQuestion('Bagaimana alur pengajuan SKBT?')"
        >
            ℹ️ Alur Pengajuan
        </button>

    </div>


    <!-- ===================================================
         TYPING
         =================================================== -->

    <div
        id="typing"
        class="typing"
    >
        Asisten sedang mengetik...
    </div>


    <!-- ===================================================
         INPUT
         =================================================== -->

    <form
        id="chatForm"
        class="chat-input-area"
    >

        <input
            id="chatInput"
            class="chat-input"
            type="text"
            placeholder="Tulis pertanyaan..."
            autocomplete="off"
            maxlength="2000"
        >


        <button
            id="sendButton"
            class="send-btn"
            type="submit"
            title="Kirim"
            aria-label="Kirim pesan"
        >
            ➤
        </button>

    </form>


</div>



<script>

/* =========================================================
   URL CLOUDFLARE WORKER
   ========================================================= */

const WORKER_URL =
    "https://quiet-bush-fe39.muhammadhabib348.workers.dev/";


/* =========================================================
   ELEMENT
   ========================================================= */

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const typing =
    document.getElementById(
        "typing"
    );


/* =========================================================
   HISTORY
   ========================================================= */

let chatHistory = [];


/* =========================================================
   TAMBAH PESAN
   ========================================================= */

function addMessage(text, sender) {

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    /*
     * Mendeteksi Markdown link:
     *
     * [Nama Link](https://alamat.com)
     */

    const linkRegex =
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;


    let lastIndex = 0;

    let match;


    while (
        (match = linkRegex.exec(text)) !== null
    ) {

        /*
         * Teks sebelum link
         */

        const beforeText =
            text.substring(
                lastIndex,
                match.index
            );


        if (beforeText) {

            bubble.appendChild(
                document.createTextNode(
                    beforeText
                )
            );

        }


        /*
         * Buat elemen link
         */

        const link =
            document.createElement("a");


        link.href =
            match[2];


        link.textContent =
            match[1];


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.className =
            "chat-link";


        bubble.appendChild(
            link
        );


        lastIndex =
            match.index +
            match[0].length;

    }


    /*
     * Teks setelah link terakhir
     */

    const remainingText =
        text.substring(
            lastIndex
        );


    if (remainingText) {

        bubble.appendChild(
            document.createTextNode(
                remainingText
            )
        );

    }


    message.appendChild(
        bubble
    );


    chatMessages.appendChild(
        message
    );


    setTimeout(
        function() {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        },
        10
    );

}


/* =========================================================
   QUICK QUESTION
   ========================================================= */

function quickQuestion(
    question
) {

    chatInput.value =
        question;

    sendMessage();

}


/* =========================================================
   FORM SUBMIT
   ========================================================= */

chatForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        sendMessage();

    }
);


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const message =
        chatInput.value.trim();


    /*
     * Jangan kirim pesan kosong.
     */

    if (!message) {

        chatInput.focus();

        return;

    }


    /*
     * Tampilkan pesan pengguna.
     */

    addMessage(
        message,
        "user"
    );


    /*
     * Kosongkan input.
     */

    chatInput.value = "";


    /*
     * Disable sementara.
     */

    sendButton.disabled =
        true;

    chatInput.disabled =
        true;


    typing.style.display =
        "block";


    try {

        console.log(
            "Mengirim pertanyaan:",
            message
        );


        /* =================================================
           REQUEST KE CLOUDFLARE WORKER
           ================================================= */

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            history:
                                chatHistory

                        })

                }
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        /* =================================================
           BACA RESPONSE
           ================================================= */

        let data;

        try {

            data =
                await response.json();

        }
        catch (error) {

            throw new Error(
                "Respons dari server tidak valid."
            );

        }


        console.log(
            "RESPONSE WORKER:",
            data
        );


        /* =================================================
           CEK ERROR
           ================================================= */

        if (
            !response.ok ||
            !data.success
        ) {

            let errorMessage =
                data.error ||
                "Gagal mendapatkan jawaban dari server.";


            /*
             * Rate limit
             */

            if (
                response.status === 429
            ) {

                errorMessage =
                    "Layanan sedang sibuk karena batas penggunaan tercapai. Silakan coba lagi beberapa saat.";

            }


            /*
             * API error
             */

            if (
                data.detail &&
                data.detail !== data.error
            ) {

                console.error(
                    "Detail error:",
                    data.detail
                );

            }


            throw new Error(
                errorMessage
            );

        }


        /* =================================================
           AMBIL JAWABAN AI
           ================================================= */

        const answer =
            data.answer;


        if (
            !answer
        ) {

            throw new Error(
                "Jawaban dari AI kosong."
            );

        }


        /* =================================================
           TAMPILKAN JAWABAN
           ================================================= */

        addMessage(
            answer,
            "bot"
        );


        /* =================================================
           SIMPAN HISTORY
           ================================================= */

        chatHistory.push({

            role:
                "user",

            content:
                message

        });


        chatHistory.push({

            role:
                "assistant",

            content:
                answer

        });


        /*
         * Batasi history menjadi
         * 10 pesan terakhir.
         */

        if (
            chatHistory.length > 10
        ) {

            chatHistory =
                chatHistory.slice(-10);

        }

    }


    catch (error) {

        console.error(
            "CHATBOT ERROR:",
            error
        );


        addMessage(

            "Maaf, terjadi kesalahan saat " +
            "menghubungi Asisten SKBT Digital.\n\n" +
            error.message,

            "bot"

        );

    }


    finally {

        typing.style.display =
            "none";


        sendButton.disabled =
            false;

        chatInput.disabled =
            false;


        chatInput.focus();


        /*
         * Pastikan pesan terbaru terlihat.
         */

        setTimeout(
            function() {

                chatMessages.scrollTop =
                    chatMessages.scrollHeight;

            },
            20
        );

    }

}


/* =========================================================
   ENTER UNTUK MENGIRIM
   ========================================================= */

chatInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   MOBILE VIEWPORT
   ========================================================= */

if (
    window.visualViewport
) {

    function updateViewport() {

        document.documentElement.style.setProperty(
            "--viewport-height",
            window.visualViewport.height + "px"
        );

    }


    window.visualViewport.addEventListener(
        "resize",
        updateViewport
    );


    updateViewport();

}

</script>


</body>
</html>
