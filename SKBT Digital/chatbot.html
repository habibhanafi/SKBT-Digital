<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asisten SKBT Digital</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Inter,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef6ff,
      #f8fbff
    );

  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;
}


/* =====================================================
   CHATBOT
   ===================================================== */

.chat-container {

  width: 100%;
  max-width: 480px;

  height: 720px;

  background: white;

  border-radius: 24px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,0.12);

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


/* =====================================================
   HEADER
   ===================================================== */

.chat-header {

  background:
    linear-gradient(
      135deg,
      #0f766e,
      #0d9488
    );

  color: white;

  padding: 20px;

  display: flex;
  align-items: center;

  gap: 14px;
}


.logo {

  width: 48px;
  height: 48px;

  background: white;

  color: #0f766e;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
}


.header-title {

  font-size: 18px;
  font-weight: 700;

}


.header-subtitle {

  font-size: 12px;

  opacity: 0.9;

  margin-top: 3px;

}


/* =====================================================
   CHAT AREA
   ===================================================== */

.chat-messages {

  flex: 1;

  overflow-y: auto;

  padding: 20px;

  background: #f8fafc;

}


.message {

  display: flex;

  margin-bottom: 14px;

}


.message.user {

  justify-content: flex-end;

}


.bubble {

  max-width: 82%;

  padding: 12px 15px;

  border-radius: 16px;

  font-size: 14px;

  line-height: 1.55;

  white-space: pre-wrap;

}


.message.bot .bubble {

  background: white;

  color: #1e293b;

  border:
    1px solid #e2e8f0;

  border-bottom-left-radius: 4px;

}


.message.user .bubble {

  background: #0f766e;

  color: white;

  border-bottom-right-radius: 4px;

}


/* =====================================================
   QUICK QUESTIONS
   ===================================================== */

.quick-questions {

  padding: 10px 15px;

  display: flex;

  gap: 8px;

  overflow-x: auto;

  background: white;

  border-top:
    1px solid #e5e7eb;

}


.quick-btn {

  border: 1px solid #cbd5e1;

  background: white;

  color: #334155;

  border-radius: 20px;

  padding: 8px 12px;

  font-size: 12px;

  white-space: nowrap;

  cursor: pointer;

}


.quick-btn:hover {

  background: #f1f5f9;

}


/* =====================================================
   INPUT
   ===================================================== */

.chat-input-area {

  padding: 12px;

  background: white;

  border-top:
    1px solid #e5e7eb;

  display: flex;

  gap: 8px;

}


.chat-input {

  flex: 1;

  border:
    1px solid #cbd5e1;

  border-radius: 22px;

  padding:
    12px 16px;

  outline: none;

  font-size: 14px;

}


.chat-input:focus {

  border-color: #0f766e;

}


.send-btn {

  width: 46px;
  height: 46px;

  border: none;

  border-radius: 50%;

  background: #0f766e;

  color: white;

  cursor: pointer;

  font-size: 18px;

  display: flex;

  align-items: center;
  justify-content: center;

}


.send-btn:hover {

  background: #115e59;

}


.send-btn:disabled {

  background: #94a3b8;

  cursor: not-allowed;

}


/* =====================================================
   TYPING
   ===================================================== */

.typing {

  display: none;

  padding: 10px 15px;

  font-size: 12px;

  color: #64748b;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

  body {

    align-items: stretch;

  }

  .chat-container {

    height: 100vh;

    max-width: none;

    border-radius: 0;

  }

}

</style>

</head>


<body>


<div class="chat-container">


  <!-- HEADER -->

  <div class="chat-header">

    <div class="logo">
      🤖
    </div>

    <div>

      <div class="header-title">
        Asisten SKBT Digital
      </div>

      <div class="header-subtitle">
        Inspektorat Daerah Kabupaten Aceh Timur
      </div>

    </div>

  </div>


  <!-- PESAN -->

  <div
    id="chatMessages"
    class="chat-messages"
  >

    <div class="message bot">

      <div class="bubble">

        Halo 👋

        Saya adalah
        <b>Asisten SKBT Digital</b>.

        Saya dapat membantu memberikan
        informasi mengenai layanan
        Surat Keterangan Bebas Temuan
        (SKBT).

        Silakan tanyakan sesuatu
        mengenai SKBT.

      </div>

    </div>

  </div>


  <!-- QUICK QUESTIONS -->

  <div class="quick-questions">

    <button
      type="button"
      class="quick-btn"
      onclick="quickQuestion('Apa itu SKBT?')"
    >
      Apa itu SKBT?
    </button>

    <button
      type="button"
      class="quick-btn"
      onclick="quickQuestion('Apa saja persyaratan SKBT?')"
    >
      Persyaratan
    </button>

    <button
      type="button"
      class="quick-btn"
      onclick="quickQuestion('Bagaimana alur pengajuan SKBT?')"
    >
      Alur Pengajuan
    </button>

  </div>


  <!-- TYPING -->

  <div
    id="typing"
    class="typing"
  >

    Asisten sedang mengetik...

  </div>


  <!-- INPUT -->

  <form
    id="chatForm"
    class="chat-input-area"
  >

    <input
      id="chatInput"
      class="chat-input"
      type="text"
      placeholder="Tulis pertanyaan..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      class="send-btn"
      type="submit"
      title="Kirim"
    >
      ➤
    </button>

  </form>


</div>


<script>

/* =====================================================
   KONFIGURASI WORKER
   ===================================================== */

const WORKER_URL =
  "https://quiet-bush-fe39.muhammadhabib348.workers.dev/";


/* =====================================================
   ELEMENT
   ===================================================== */

const chatForm =
  document.getElementById(
    "chatForm"
  );

const chatInput =
  document.getElementById(
    "chatInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const chatMessages =
  document.getElementById(
    "chatMessages"
  );

const typing =
  document.getElementById(
    "typing"
  );


/* =====================================================
   HISTORY
   ===================================================== */

let chatHistory = [];


/* =====================================================
   TAMBAH PESAN
   ===================================================== */

function addMessage(
  text,
  sender
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    sender;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  message.appendChild(
    bubble
  );


  chatMessages.appendChild(
    message
  );


  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =====================================================
   QUICK QUESTION
   ===================================================== */

function quickQuestion(
  question
) {

  chatInput.value =
    question;

  chatInput.focus();

  sendMessage();

}


/* =====================================================
   SUBMIT
   ===================================================== */

chatForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    sendMessage();

  }
);


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

  const message =
    chatInput.value.trim();


  if (!message) {

    chatInput.focus();

    return;

  }


  /* tampilkan pesan user */

  addMessage(
    message,
    "user"
  );


  /* kosongkan input */

  chatInput.value = "";


  /* disable */

  sendButton.disabled =
    true;

  chatInput.disabled =
    true;


  typing.style.display =
    "block";


  try {

    console.log(
      "Mengirim pertanyaan:",
      message
    );


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                message,

              history:
                chatHistory

            })

        }
      );


    console.log(
      "HTTP STATUS:",
      response.status
    );


    const data =
      await response.json();


    console.log(
      "RESPONSE WORKER:",
      data
    );


    /* =========================================
       ERROR DARI WORKER
       ========================================= */

    if (
      !response.ok ||
      !data.success
    ) {

      const detail =
        data.detail ||
        data.error ||
        "Gagal mendapatkan jawaban.";

      throw new Error(
        detail
      );

    }


    /* =========================================
       JAWABAN
       ========================================= */

    const answer =
      data.answer;


    if (!answer) {

      throw new Error(
        "Jawaban dari AI kosong."
      );

    }


    addMessage(
      answer,
      "bot"
    );


    /* =========================================
       SIMPAN HISTORY
       ========================================= */

    chatHistory.push({

      role:
        "user",

      content:
        message

    });


    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    /* batasi history */

    if (
      chatHistory.length > 10
    ) {

      chatHistory =
        chatHistory.slice(-10);

    }


  }

  catch (error) {

    console.error(
      "ERROR CHATBOT:",
      error
    );


    addMessage(

      "Maaf, terjadi kesalahan saat " +
      "menghubungi Asisten SKBT Digital.\n\n" +
      error.message,

      "bot"

    );

  }


  finally {

    typing.style.display =
      "none";


    sendButton.disabled =
      false;

    chatInput.disabled =
      false;


    chatInput.focus();

  }

}


/* =====================================================
   ENTER
   ===================================================== */

chatInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>


</body>
</html>
