<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Asisten SKBT Digital</title>


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   BODY
   ===================================================== */

body {

    background:
        #eef5fb;

    color:
        #12345b;

}


/* =====================================================
   CONTAINER UTAMA
   ===================================================== */

.chat-container {

    width:
        min(900px, 100%);

    height:
        100dvh;

    height:
        100svh;

    margin:
        0 auto;

    display:
        flex;

    flex-direction:
        column;

    background:
        #ffffff;

    overflow:
        hidden;

}


/* =====================================================
   HEADER
   ===================================================== */

.chat-header {

    flex:
        0 0 auto;

    min-height:
        96px;

    padding:
        20px 26px;

    display:
        flex;

    align-items:
        center;

    gap:
        14px;

    color:
        #ffffff;

    background:
        linear-gradient(
            135deg,
            #1565c0,
            #0d47a1
        );

}


/* LOGO */

.logo {

    width:
        48px;

    height:
        48px;

    flex:
        0 0 48px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        12px;

    background:
        rgba(255,255,255,0.16);

    font-size:
        28px;

}


/* JUDUL */

.header-title {

    font-size:
        25px;

    font-weight:
        700;

    line-height:
        1.2;

}


/* SUBTITLE */

.header-subtitle {

    margin-top:
        4px;

    font-size:
        14px;

    line-height:
        1.4;

    opacity:
        0.95;

}


/* =====================================================
   AREA PESAN
   ===================================================== */

.chat-messages {

    flex:
        1 1 auto;

    min-height:
        0;

    overflow-y:
        auto;

    overflow-x:
        hidden;

    padding:
        20px;

    background:
        #ffffff;

    scroll-behavior:
        smooth;

    -webkit-overflow-scrolling:
        touch;

}


/* SCROLLBAR */

.chat-messages::-webkit-scrollbar {

    width:
        8px;

}

.chat-messages::-webkit-scrollbar-track {

    background:
        #f2f6fa;

}

.chat-messages::-webkit-scrollbar-thumb {

    background:
        #b8cbe0;

    border-radius:
        20px;

}


/* =====================================================
   PESAN
   ===================================================== */

.message {

    display:
        flex;

    width:
        100%;

    margin-bottom:
        14px;

}


/* BOT */

.message.bot {

    justify-content:
        flex-start;

}


/* USER */

.message.user {

    justify-content:
        flex-end;

}


/* =====================================================
   BUBBLE
   ===================================================== */

.bubble {

    max-width:
        min(78%, 650px);

    padding:
        13px 16px;

    border-radius:
        14px;

    font-size:
        15px;

    line-height:
        1.55;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

}


/* BOT BUBBLE */

.message.bot .bubble {

    background:
        #e7f0fa;

    color:
        #123f70;

    border-top-left-radius:
        4px;

}


/* USER BUBBLE */

.message.user .bubble {

    background:
        #1565c0;

    color:
        #ffffff;

    border-top-right-radius:
        4px;

}


/* =====================================================
   QUICK QUESTIONS
   ===================================================== */

.quick-questions {

    flex:
        0 0 auto;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        8px 14px 6px;

    background:
        #ffffff;

    border-top:
        1px solid #edf2f7;

    overflow-x:
        auto;

    overflow-y:
        hidden;

    white-space:
        nowrap;

    scrollbar-width:
        none;

}


.quick-questions::-webkit-scrollbar {

    display:
        none;

}


/* =====================================================
   QUICK BUTTON
   ===================================================== */

.quick-btn {

    flex:
        0 0 auto;

    padding:
        9px 14px;

    border:
        1px solid #a9c7e8;

    border-radius:
        20px;

    background:
        #ffffff;

    color:
        #1565c0;

    font-size:
        13px;

    cursor:
        pointer;

    transition:
        all 0.2s ease;

}


/* HOVER */

.quick-btn:hover {

    background:
        #00bcd4;

    border-color:
        #00bcd4;

    color:
        #ffffff;

}


/* ACTIVE */

.quick-btn:active {

    transform:
        scale(0.97);

}


/* =====================================================
   TYPING
   ===================================================== */

.typing {

    display:
        none;

    flex:
        0 0 auto;

    padding:
        2px 16px 6px;

    background:
        #ffffff;

    color:
        #718096;

    font-size:
        12px;

    font-style:
        italic;

}


/* =====================================================
   INPUT AREA
   ===================================================== */

.chat-input-area {

    flex:
        0 0 auto;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        8px 14px 14px;

    background:
        #ffffff;

    border-top:
        1px solid #edf2f7;

}


/* =====================================================
   INPUT
   ===================================================== */

.chat-input {

    flex:
        1 1 auto;

    min-width:
        0;

    height:
        44px;

    padding:
        0 15px;

    border:
        1px solid #b8cde4;

    border-radius:
        10px;

    outline:
        none;

    background:
        #ffffff;

    color:
        #173f68;

    font-size:
        14px;

}


.chat-input::placeholder {

    color:
        #8a9caf;

}


/* FOCUS */

.chat-input:focus {

    border-color:
        #1976d2;

    box-shadow:
        0 0 0 3px rgba(25,118,210,0.10);

}


/* =====================================================
   SEND BUTTON
   ===================================================== */

.send-btn {

    width:
        48px;

    height:
        44px;

    flex:
        0 0 48px;

    border:
        none;

    border-radius:
        10px;

    background:
        #1565c0;

    color:
        #ffffff;

    font-size:
        20px;

    cursor:
        pointer;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    transition:
        all 0.2s ease;

}


/* HOVER */

.send-btn:hover {

    background:
        #00a9c7;

}


/* DISABLED */

.send-btn:disabled {

    opacity:
        0.55;

    cursor:
        not-allowed;

}


/* =====================================================
   DESKTOP
   ===================================================== */

@media (min-width: 901px) {

    .chat-container {

        height:
            100dvh;

        max-height:
            100dvh;

    }

}


/* =====================================================
   TABLET
   ===================================================== */

@media (max-width: 700px) {

    body {

        background:
            #ffffff;

    }

    .chat-container {

        width:
            100%;

        height:
            100dvh;

        height:
            100svh;

        border-radius:
            0;

    }

    .chat-header {

        min-height:
            82px;

        padding:
            14px 18px;

    }

    .logo {

        width:
            42px;

        height:
            42px;

        flex-basis:
            42px;

        font-size:
            24px;

    }

    .header-title {

        font-size:
            21px;

    }

    .header-subtitle {

        font-size:
            12px;

    }

    .chat-messages {

        padding:
            14px;

    }

    .bubble {

        max-width:
            86%;

        font-size:
            14px;

        padding:
            11px 13px;

    }

}


/* =====================================================
   HP
   ===================================================== */

@media (max-width: 480px) {

    .chat-header {

        min-height:
            74px;

        padding:
            11px 14px;

        gap:
            10px;

    }


    .logo {

        width:
            38px;

        height:
            38px;

        flex-basis:
            38px;

        border-radius:
            10px;

        font-size:
            21px;

    }


    .header-title {

        font-size:
            18px;

    }


    .header-subtitle {

        margin-top:
            2px;

        font-size:
            11px;

    }


    .chat-messages {

        padding:
            12px;

    }


    .message {

        margin-bottom:
            10px;

    }


    .bubble {

        max-width:
            90%;

        padding:
            10px 12px;

        font-size:
            13.5px;

        line-height:
            1.5;

        border-radius:
            12px;

    }


    .quick-questions {

        padding:
            7px 10px 5px;

        gap:
            6px;

    }


    .quick-btn {

        padding:
            8px 11px;

        font-size:
            12px;

    }


    .typing {

        padding:
            2px 12px 5px;

        font-size:
            11px;

    }


    .chat-input-area {

        gap:
            7px;

        padding:
            7px 10px
            calc(
                10px +
                env(safe-area-inset-bottom)
            );

    }


    .chat-input {

        height:
            42px;

        padding:
            0 12px;

        font-size:
            14px;

        border-radius:
            10px;

    }


    .send-btn {

        width:
            44px;

        height:
            42px;

        flex-basis:
            44px;

        font-size:
            18px;

        border-radius:
            10px;

    }

}


/* =====================================================
   HP SANGAT KECIL
   ===================================================== */

@media (max-width: 360px) {

    .header-title {

        font-size:
            16px;

    }

    .header-subtitle {

        font-size:
            10px;

    }

    .logo {

        width:
            34px;

        height:
            34px;

        flex-basis:
            34px;

        font-size:
            19px;

    }

    .bubble {

        font-size:
            13px;

    }

}


/* =====================================================
   SAFE AREA IOS
   ===================================================== */

@supports (padding: max(0px)) {

    .chat-header {

        padding-top:
            max(
                14px,
                env(safe-area-inset-top)
            );

    }

}


/* =====================================================
   REDUCE MOTION
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    .chat-messages {

        scroll-behavior:
            auto;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     CHAT CONTAINER
     ===================================================== -->

<div class="chat-container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="chat-header">

        <div class="logo">
            🤖
        </div>

        <div>

            <div class="header-title">
                Asisten SKBT Digital
            </div>

            <div class="header-subtitle">
                Inspektorat Daerah Kabupaten Aceh Timur
            </div>

        </div>

    </div>


    <!-- =================================================
         AREA CHAT
         ================================================= -->

    <div
        id="chatMessages"
        class="chat-messages"
    >

        <div class="message bot">

            <div class="bubble">

                Halo 👋

                Saya adalah
                <b>Asisten SKBT Digital</b>.

                Saya dapat membantu memberikan
                informasi mengenai layanan
                Surat Keterangan Bebas Temuan
                (SKBT).

                Silakan tanyakan sesuatu
                mengenai SKBT.

            </div>

        </div>

    </div>


    <!-- =================================================
         QUICK QUESTIONS
         ================================================= -->

    <div class="quick-questions">

        <button
            type="button"
            class="quick-btn"
            onclick="quickQuestion('Apa itu SKBT?')"
        >
            📄 Apa itu SKBT?
        </button>


        <button
            type="button"
            class="quick-btn"
            onclick="quickQuestion('Apa saja persyaratan SKBT?')"
        >
            📋 Persyaratan
        </button>


        <button
            type="button"
            class="quick-btn"
            onclick="quickQuestion('Bagaimana alur pengajuan SKBT?')"
        >
            ℹ️ Alur Pengajuan
        </button>

    </div>


    <!-- =================================================
         TYPING
         ================================================= -->

    <div
        id="typing"
        class="typing"
    >

        Asisten sedang mengetik...

    </div>


    <!-- =================================================
         INPUT
         ================================================= -->

    <form
        id="chatForm"
        class="chat-input-area"
    >

        <input
            id="chatInput"
            class="chat-input"
            type="text"
            placeholder="Tulis pertanyaan..."
            autocomplete="off"
            maxlength="2000"
        >


        <button
            id="sendButton"
            class="send-btn"
            type="submit"
            title="Kirim"
            aria-label="Kirim pesan"
        >

            ➤

        </button>

    </form>


</div>



<script>

/* =====================================================
   KONFIGURASI WORKER
   ===================================================== */

const WORKER_URL =
    "https://quiet-bush-fe39.muhammadhabib348.workers.dev/";


/* =====================================================
   ELEMENT
   ===================================================== */

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const typing =
    document.getElementById(
        "typing"
    );


/* =====================================================
   HISTORY
   ===================================================== */

let chatHistory = [];


/* =====================================================
   TAMBAH PESAN
   ===================================================== */

function addMessage(
    text,
    sender
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        sender;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    /*
    textContent digunakan agar AI tidak bisa
    menyisipkan HTML/JavaScript ke halaman.
    */

    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chatMessages.appendChild(
        message
    );


    /*
    Scroll hanya area chat,
    bukan seluruh halaman.
    */

    requestAnimationFrame(
        () => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }
    );

}


/* =====================================================
   QUICK QUESTION
   ===================================================== */

function quickQuestion(
    question
) {

    chatInput.value =
        question;

    chatInput.focus();

    sendMessage();

}


/* =====================================================
   SUBMIT
   ===================================================== */

chatForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        sendMessage();

    }
);


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

    const message =
        chatInput.value.trim();


    if (!message) {

        chatInput.focus();

        return;

    }


    /*
    Tampilkan pesan user.
    */

    addMessage(
        message,
        "user"
    );


    /*
    Kosongkan input.
    */

    chatInput.value =
        "";


    /*
    Disable input selama AI menjawab.
    */

    sendButton.disabled =
        true;

    chatInput.disabled =
        true;


    typing.style.display =
        "block";


    /*
    Scroll ke bawah.
    */

    requestAnimationFrame(
        () => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }
    );


    try {

        console.log(
            "Mengirim pertanyaan:",
            message
        );


        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            history:
                                chatHistory

                        })

                }
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        /*
        Coba membaca JSON.
        */

        let data;

        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "Respons dari server tidak valid."
            );

        }


        console.log(
            "RESPONSE WORKER:",
            data
        );


        /* =========================================
           ERROR WORKER
           ========================================= */

        if (
            !response.ok ||
            !data.success
        ) {

            let detail =
                data.error ||
                "Gagal mendapatkan jawaban.";


            /*
            Pesan khusus rate limit.
            */

            if (
                response.status === 429
            ) {

                detail =
                    "Layanan sedang sibuk karena batas penggunaan tercapai. Silakan coba lagi beberapa saat.";

            }


            throw new Error(
                detail
            );

        }


        /* =========================================
           JAWABAN AI
           ========================================= */

        const answer =
            data.answer;


        if (
            !answer
        ) {

            throw new Error(
                "Jawaban dari AI kosong."
            );

        }


        /*
        Tampilkan jawaban.
        */

        addMessage(
            answer,
            "bot"
        );


        /* =========================================
           SIMPAN HISTORY
           ========================================= */

        chatHistory.push({

            role:
                "user",

            content:
                message

        });


        chatHistory.push({

            role:
                "assistant",

            content:
                answer

        });


        /*
        Maksimal 10 pesan.
        */

        if (
            chatHistory.length > 10
        ) {

            chatHistory =
                chatHistory.slice(-10);

        }


    }


    catch (error) {

        console.error(
            "ERROR CHATBOT:",
            error
        );


        addMessage(

            "Maaf, terjadi kesalahan saat " +
            "menghubungi Asisten SKBT Digital.\n\n" +
            error.message,

            "bot"

        );

    }


    finally {

        typing.style.display =
            "none";


        sendButton.disabled =
            false;

        chatInput.disabled =
            false;


        chatInput.focus();


        /*
        Pastikan area chat tetap
        berada pada pesan terbaru.
        */

        requestAnimationFrame(
            () => {

                chatMessages.scrollTop =
                    chatMessages.scrollHeight;

            }
        );

    }

}


/* =====================================================
   ENTER
   ===================================================== */

chatInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   MOBILE KEYBOARD
   =====================================================

   Pada HP, ketika keyboard muncul, beberapa browser
   mengubah visual viewport.

   Kode ini membantu menjaga chatbot tetap berada
   di area yang terlihat.
   ===================================================== */

if (
    window.visualViewport
) {

    const updateViewport =
        () => {

            document.documentElement
                .style
                .setProperty(
                    "--viewport-height",
                    `${window.visualViewport.height}px`
                );

        };


    window.visualViewport.addEventListener(
        "resize",
        updateViewport
    );


    window.visualViewport.addEventListener(
        "scroll",
        updateViewport
    );


    updateViewport();

}

</script>


</body>
</html>
